<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>连续计时器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #1e1e2e;
    color: #e0e0e8;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 1rem;
  }
  h1 { font-size: 1.4rem; margin-bottom: 1.2rem; color: #9ecbff; }
  .setup {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.2rem;
  }
  .setup label { font-size: 0.95rem; }
  .setup input {
    width: 4.5rem;
    padding: 0.4rem;
    font-size: 1.1rem;
    text-align: center;
    border: 1px solid #44475a;
    border-radius: 6px;
    background: #2a2a3c;
    color: #e0e0e8;
  }
  .setup input:disabled { opacity: 0.5; }
  #countdown {
    font-size: 4rem;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    margin-bottom: 1.2rem;
    letter-spacing: 2px;
  }
  #countdown.warning { color: #ffb86c; }
  #countdown.done { color: #ff5555; }
  .buttons { display: flex; gap: 1rem; margin-bottom: 1.6rem; }
  button {
    padding: 0.7rem 2.2rem;
    font-size: 1.15rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.05s, filter 0.15s;
  }
  button:active { transform: scale(0.97); }
  button:hover { filter: brightness(1.15); }
  #mainBtn { background: #50fa7b; color: #1e1e2e; font-weight: 700; }
  #mainBtn.running { background: #8be9fd; }
  #mainBtn:disabled { background: #44475a; color: #777; cursor: not-allowed; }
  #pauseBtn { background: #ffb86c; color: #1e1e2e; font-weight: 600; }
  #pauseBtn.paused { background: #f1fa8c; }
  #stopBtn { background: #ff5555; color: #fff; font-weight: 600; }
  #pauseBtn:disabled, #stopBtn:disabled { background: #44475a; color: #777; cursor: not-allowed; }
  #resetBtn { background: #44475a; color: #e0e0e8; }
  #fullscreenBtn { background: #44475a; color: #e0e0e8; }
  #langBtn { background: #44475a; color: #e0e0e8; }
  #mergeBtn { background: #bd93f9; color: #1e1e2e; font-weight: 600; }
  #mergeBtn:disabled { background: #44475a; color: #777; cursor: not-allowed; }
  .merge-panel {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1.2rem;
    padding: 0.7rem 1rem;
    background: #2a2a3c;
    border: 1px solid #bd93f9;
    border-radius: 8px;
  }
  .merge-panel[hidden] { display: none; }
  .merge-panel input {
    width: 14rem;
    padding: 0.4rem 0.6rem;
    font-size: 1rem;
    border: 1px solid #44475a;
    border-radius: 6px;
    background: #1e1e2e;
    color: #e0e0e8;
  }
  .merge-panel button { padding: 0.4rem 1.1rem; font-size: 0.95rem; }
  #mergeOk { background: #50fa7b; color: #1e1e2e; font-weight: 600; }
  #mergeCancel { background: #44475a; color: #e0e0e8; }
  #mergeError { color: #ff5555; font-size: 0.85rem; }
  tr.parent-row td { font-weight: 600; }
  tr.child-row td { color: #9a9ab0; font-size: 0.9rem; background: #22223250; }
  tr.child-row td:first-child { text-align: right; padding-right: 1.6rem; }
  table.merge-open tbody tr[data-n] { cursor: pointer; }
  table.merge-open tbody tr[data-n]:hover td { background: #bd93f922; }
  tbody tr.selected-row td { background: #bd93f94d; }
  table.preset tbody tr[data-n] { cursor: pointer; }
  table.preset tbody tr[data-n]:hover td { background: #50fa7b14; }
  tbody tr.active-seg td { background: #50fa7b26; }
  tbody tr.active-seg td:first-child { color: #50fa7b; font-weight: 700; }
  tbody tr.active-child td { background: #50fa7b26 !important; }
  tbody tr.active-child td:first-child { color: #50fa7b; }
  table {
    border-collapse: collapse;
    min-width: 32rem;
    background: #2a2a3c;
    border-radius: 8px;
  }
  th:first-child { border-top-left-radius: 8px; }
  th:last-child { border-top-right-radius: 8px; }
  th, td {
    padding: 0.55rem 1.1rem;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  th { background: #383850; color: #9ecbff; font-weight: 600; position: sticky; top: 0; z-index: 1; }
  tbody tr:nth-child(even) { background: #30304400; }
  tbody tr:nth-child(odd) { background: #26263630; }
  tbody tr { border-top: 1px solid #38385080; }
  #empty { color: #777; margin-top: 0.8rem; font-size: 0.9rem; }
  /* 只滚动时间段列表，上方的倒计时和按钮固定 */
  .lap-area {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
</style>
</head>
<body>
  <h1 id="titleEl">⏱️ 连续计时器</h1>

  <div class="setup">
    <label id="totalLabel">总时间：</label>
    <input type="number" id="minInput" min="0" max="999" value="10"> <span id="minUnit">分</span>
    <input type="number" id="secInput" min="0" max="59" value="0"> <span id="secUnit">秒</span>
    <label id="segLabel" style="margin-left:1rem">段数：</label>
    <input type="number" id="segInput" min="0" max="99" value="0" title="0 = 顺序记录模式；N = 预先显示 N 个时间段，点击时间段计时">
  </div>

  <div id="countdown">10:00</div>

  <div class="buttons">
    <button id="mainBtn">开始</button>
    <button id="pauseBtn" disabled>暂停</button>
    <button id="stopBtn" disabled>停止</button>
    <button id="mergeBtn" disabled>合并时间段</button>
    <button id="resetBtn">重置</button>
    <button id="fullscreenBtn" aria-pressed="false">全屏</button>
    <button id="langBtn">转英文</button>
  </div>

  <div class="merge-panel" id="mergePanel" hidden>
    <label id="mergeLabel">要合并的序号：</label>
    <input type="text" id="mergeInput" placeholder="点击下方时间段，或输入如 2 4 5">
    <button id="mergeOk">确认合并</button>
    <button id="mergeCancel">取消</button>
    <span id="mergeError"></span>
  </div>

  <div class="lap-area">
    <table id="lapTable" hidden>
      <thead>
        <tr>
          <th id="thNo">序号</th>
          <th id="thStart">开始倒计时</th>
          <th id="thEnd">结束倒计时</th>
          <th id="thDur">时长</th>
          <th id="thTotal">总时长</th>
        </tr>
      </thead>
      <tbody id="lapBody"></tbody>
    </table>
    <div id="empty">尚未开始。设置总时间后点击「开始」。</div>
  </div>

<script>
(() => {
  const minInput = document.getElementById('minInput');
  const secInput = document.getElementById('secInput');
  const segInput = document.getElementById('segInput');
  const countdownEl = document.getElementById('countdown');
  const mainBtn = document.getElementById('mainBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');
  const resetBtn = document.getElementById('resetBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const lapTable = document.getElementById('lapTable');
  const lapBody = document.getElementById('lapBody');
  const emptyEl = document.getElementById('empty');
  const mergeBtn = document.getElementById('mergeBtn');
  const mergePanel = document.getElementById('mergePanel');
  const mergeInput = document.getElementById('mergeInput');
  const mergeOk = document.getElementById('mergeOk');
  const mergeCancel = document.getElementById('mergeCancel');
  const mergeError = document.getElementById('mergeError');

  let totalMs = 0;        // 总时间（毫秒）
  let startEpoch = 0;     // 倒计时开始的时间戳
  let running = false;
  let paused = false;
  let pausedAt = 0;       // 暂停时刻的时间戳
  let finished = false;
  let timerId = null;
  let screenWakeLock = null;
  let screenWakeLockRequest = null;
  let lapStartRemaining = 0; // 当前段开始时的剩余时间（毫秒）
  let laps = [];          // { start, end, children: [{start, end}] }，预设模式空段 start/end 为 null
  let preset = false;     // 预设段数模式
  let activeIdx = null;   // 预设模式：当前正在计时的段下标

  // ── 多语言 ──
  const I18N = {
    zh: {
      docTitle: '连续计时器',
      title: '⏱️ 连续计时器',
      totalTime: '总时间：', min: '分', sec: '秒',
      segCount: '段数：',
      segTitle: '0 = 顺序记录模式；N = 预先显示 N 个时间段，点击时间段计时',
      start: '开始', record: '记录时间段', clickSeg: '点击时间段计时', finished: '已结束',
      pause: '暂停', resume: '继续', stop: '停止',
      merge: '合并时间段', reset: '重置', lang: '转英文',
      fullscreen: '全屏', exitFullscreen: '退出全屏',
      fullscreenError: '无法切换全屏模式，请检查浏览器权限。',
      mergeLabel: '要合并的序号：',
      mergePlaceholder: '点击下方时间段，或输入如 2 4 5',
      mergeOk: '确认合并', cancel: '取消',
      thNo: '序号', thStart: '开始倒计时', thEnd: '结束倒计时', thDur: '时长', thTotal: '总时长',
      empty: '尚未开始。设置总时间后点击「开始」。',
      alertTime: '请先设置大于 0 的总时间',
      errAtLeast2: '请输入至少 2 个不同的序号',
      errInvalid: (bad, max) => `无效序号：${bad}（当前范围 1-${max}）`,
      errEmpty: list => `段 ${list} 还没有记录，不能合并`,
    },
    en: {
      docTitle: 'Continuous Timer',
      title: '⏱️ Continuous Timer',
      totalTime: 'Total time:', min: 'min', sec: 'sec',
      segCount: 'Segments:',
      segTitle: '0 = sequential mode; N = pre-create N segments, click a segment to time it',
      start: 'Start', record: 'Record segment', clickSeg: 'Click a segment to time', finished: 'Finished',
      pause: 'Pause', resume: 'Resume', stop: 'Stop',
      merge: 'Merge segments', reset: 'Reset', lang: 'Change to Chinese',
      fullscreen: 'Fullscreen', exitFullscreen: 'Exit fullscreen',
      fullscreenError: 'Unable to change fullscreen mode. Check your browser permissions.',
      mergeLabel: 'Numbers to merge:',
      mergePlaceholder: 'Click segments below, or type e.g. 2 4 5',
      mergeOk: 'Merge', cancel: 'Cancel',
      thNo: 'No.', thStart: 'Countdown start', thEnd: 'Countdown end', thDur: 'Duration', thTotal: 'Total',
      empty: 'Not started yet. Set the total time and click "Start".',
      alertTime: 'Please set a total time greater than 0',
      errAtLeast2: 'Enter at least 2 different numbers',
      errInvalid: (bad, max) => `Invalid numbers: ${bad} (valid range 1-${max})`,
      errEmpty: list => `Segment ${list} has no record yet and cannot be merged`,
    }
  };
  let lang = 'zh';
  const t = k => I18N[lang][k];

  function applyLang() {
    document.title = t('docTitle');
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.getElementById('titleEl').textContent = t('title');
    document.getElementById('totalLabel').textContent = t('totalTime');
    document.getElementById('minUnit').textContent = t('min');
    document.getElementById('secUnit').textContent = t('sec');
    document.getElementById('segLabel').textContent = t('segCount');
    segInput.title = t('segTitle');
    stopBtn.textContent = t('stop');
    mergeBtn.textContent = t('merge');
    resetBtn.textContent = t('reset');
    fullscreenBtn.textContent = document.fullscreenElement ? t('exitFullscreen') : t('fullscreen');
    fullscreenBtn.setAttribute('aria-pressed', String(!!document.fullscreenElement));
    document.getElementById('langBtn').textContent = t('lang');
    document.getElementById('mergeLabel').textContent = t('mergeLabel');
    mergeInput.placeholder = t('mergePlaceholder');
    mergeOk.textContent = t('mergeOk');
    mergeCancel.textContent = t('cancel');
    for (const id of ['thNo', 'thStart', 'thEnd', 'thDur', 'thTotal']) {
      document.getElementById(id).textContent = t(id);
    }
    emptyEl.textContent = t('empty');
    pauseBtn.textContent = paused ? t('resume') : t('pause');
    mergeError.textContent = '';
    updateMainBtn();
  }

  function fmt(ms) {
    ms = Math.max(0, Math.round(ms / 1000) * 1000);
    const s = ms / 1000;
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }

  function remaining() {
    const now = paused ? pausedAt : Date.now();
    return totalMs - (now - startEpoch);
  }

  function render() {
    const r = running || finished ? remaining() : totalMs;
    countdownEl.textContent = fmt(r);
    countdownEl.classList.toggle('warning', running && r > 0 && r <= 60000);
    countdownEl.classList.toggle('done', finished || (running && r <= 0));
  }

  function previewFromInputs() {
    totalMs = ((+minInput.value || 0) * 60 + (+secInput.value || 0)) * 1000;
    countdownEl.textContent = fmt(totalMs);
  }

  function lapDuration(lap) {
    // 总时长：parent 为所有已完成 children 时长之和（进行中的不计）；普通段为自身时长
    return lap.children.length
      ? lap.children.reduce((s, c) => s + (c.end === null ? 0 : c.start - c.end), 0)
      : lap.start - lap.end;
  }

  function hasRecord(lap) {
    return lap.start !== null || lap.children.length > 0;
  }

  function renderLaps() {
    lapBody.innerHTML = '';
    laps.forEach((lap, i) => {
      const n = i + 1;
      const tr = document.createElement('tr');
      tr.dataset.n = n; // 顶层行可点击（合并选择 / 预设模式计时）
      if (lap.children.length) tr.className = 'parent-row';
      const isActive = preset && running && i === activeIdx;
      if (isActive) tr.classList.add('active-seg');
      const rec = hasRecord(lap);
      // 有正在记录中的 child 时，parent 的结束倒计时待定
      const hasPending = lap.children.length > 0 && lap.children[lap.children.length - 1].end === null;
      // 无 children 或 parent：只显示总时长，不显示时长；空段显示 —；计时中显示 ···
      const startTxt = rec ? fmt(lap.start) : (isActive ? fmt(lapStartRemaining) : '—');
      const endTxt = hasPending ? '···' : (rec ? fmt(lap.end) : (isActive ? '···' : '—'));
      const totTxt = rec ? fmt(lapDuration(lap)) : (isActive ? '···' : '—');
      tr.innerHTML = `<td>${n}${isActive ? ' ⏱' : ''}</td>`
        + `<td>${startTxt}</td>`
        + `<td>${endTxt}</td><td></td>`
        + `<td>${totTxt}</td>`;
      lapBody.appendChild(tr);
      lap.children.forEach((c, j) => {
        const ctr = document.createElement('tr');
        const pending = c.end === null; // 正在记录中的 child
        ctr.className = 'child-row' + (pending ? ' active-child' : '');
        // child：只显示时长，不显示总时长；进行中显示 ···
        ctr.innerHTML = `<td>└ ${n}.${j + 1}${pending ? ' ⏱' : ''}</td>`
          + `<td>${fmt(c.start)}</td>`
          + `<td>${pending ? '···' : fmt(c.end)}</td>`
          + `<td>${pending ? '···' : fmt(c.start - c.end)}</td><td></td>`;
        lapBody.appendChild(ctr);
      });
    });
    lapTable.hidden = laps.length === 0;
    emptyEl.hidden = laps.length !== 0;
  }

  function addLap(startRem, endRem) {
    laps.push({ start: startRem, end: endRem, children: [] });
    renderLaps();
    updateMergeBtn();
  }

  // 预设模式：把一次计时记入指定段
  function commitTiming(idx, startRem, endRem) {
    const lap = laps[idx];
    const last = lap.children[lap.children.length - 1];
    if (last && last.end === null) {
      // 已有进行中的 child（点击时立即创建的）：填入结束时间
      last.end = endRem;
    } else if (!hasRecord(lap)) {
      lap.start = startRem;
      lap.end = endRem;
      return;
    } else {
      // 已有记录但没有 children：先把原记录变成第一个 child
      if (!lap.children.length) lap.children.push({ start: lap.start, end: lap.end });
      lap.children.push({ start: startRem, end: endRem });
    }
    lap.start = lap.children[0].start;
    lap.end = lap.children[lap.children.length - 1].end;
  }

  // 根据段数输入重建时间段列表（0 = 顺序模式，N = 预设 N 个空段）
  function rebuild() {
    const n = Math.min(99, Math.max(0, Math.floor(+segInput.value || 0)));
    preset = n > 0;
    laps = Array.from({ length: n }, () => ({ start: null, end: null, children: [] }));
    activeIdx = null;
    finished = false;
    lapTable.classList.toggle('preset', preset);
    countdownEl.classList.remove('warning', 'done');
    updateMainBtn();
    renderLaps();
    updateMergeBtn();
  }

  function updateMainBtn() {
    if (preset) {
      mainBtn.disabled = true;
      mainBtn.textContent = finished ? t('finished') : t('clickSeg');
    } else {
      mainBtn.disabled = finished || paused;
      mainBtn.textContent = finished ? t('finished') : (running ? t('record') : t('start'));
    }
  }

  function updateMergeBtn() {
    // 停止时可合并（经典模式暂停时也可），且至少要有 2 个时间段
    const available = laps.length >= 2 && (!running || (paused && !preset));
    mergeBtn.disabled = !available;
    if (!available) hideMergePanel();
  }

  function hideMergePanel() {
    mergePanel.hidden = true;
    mergeInput.value = '';
    mergeError.textContent = '';
    lapTable.classList.remove('merge-open');
    updateRowHighlights();
  }

  function parseNums(text) {
    return [...new Set(text.split(/[^0-9]+/).filter(Boolean).map(Number))].sort((a, b) => a - b);
  }

  function updateRowHighlights() {
    const sel = new Set(mergePanel.hidden ? [] : parseNums(mergeInput.value));
    for (const tr of lapBody.children) {
      if (tr.dataset.n) tr.classList.toggle('selected-row', sel.has(+tr.dataset.n));
    }
  }

  function tick() {
    const r = remaining();
    render();
    if (r <= 0) {
      // 时间到：结算最后一段
      stopCountdown(true);
    }
  }

  function beep() {
    if (!window.AudioContext) return;
    const context = new AudioContext();
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    const now = context.currentTime;
    oscillator.frequency.setValueAtTime(880, now);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 2);
    oscillator.connect(gain);
    gain.connect(context.destination);
    oscillator.start(now);
    oscillator.stop(now + 2);
    oscillator.addEventListener('ended', () => context.close(), { once: true });
  }

  async function syncScreenWakeLock() {
    const shouldHold = !!document.fullscreenElement && document.visibilityState === 'visible';
    if (!shouldHold) {
      if (screenWakeLock) {
        const lock = screenWakeLock;
        screenWakeLock = null;
        try {
          await lock.release();
        } catch (error) {
          console.warn('Unable to release the screen wake lock.', error);
        }
      }
      return;
    }
    if (!('wakeLock' in navigator) || screenWakeLock || screenWakeLockRequest) return;

    let request = null;
    try {
      request = navigator.wakeLock.request('screen');
      screenWakeLockRequest = request;
      const lock = await request;
      if (screenWakeLockRequest === request) screenWakeLockRequest = null;
      if (!running || paused || document.visibilityState !== 'visible') {
        await lock.release();
        return;
      }
      if (lock.released) {
        syncScreenWakeLock();
        return;
      }
      screenWakeLock = lock;
      lock.addEventListener('release', () => {
        if (screenWakeLock === lock) screenWakeLock = null;
        if (document.fullscreenElement && document.visibilityState === 'visible') syncScreenWakeLock();
      }, { once: true });
    } catch (error) {
      if (request && screenWakeLockRequest === request) screenWakeLockRequest = null;
      console.warn('Unable to keep the screen awake while the timer is running.', error);
    }
  }

  function stopCountdown(timeUp) {
    clearInterval(timerId);
    timerId = null;
    const endRem = timeUp ? 0 : Math.max(0, Math.round(remaining() / 1000) * 1000);
    if (timeUp) beep();
    if (preset) {
      if (activeIdx !== null) commitTiming(activeIdx, lapStartRemaining, endRem);
      activeIdx = null;
    } else {
      addLap(lapStartRemaining, endRem);
    }
    running = false;
    paused = false;
    syncScreenWakeLock();
    finished = timeUp;
    countdownEl.textContent = fmt(endRem);
    countdownEl.classList.remove('warning');
    countdownEl.classList.toggle('done', timeUp);
    minInput.disabled = secInput.disabled = segInput.disabled = false;
    updateMainBtn();
    mainBtn.classList.remove('running');
    pauseBtn.textContent = t('pause');
    pauseBtn.classList.remove('paused');
    pauseBtn.disabled = stopBtn.disabled = true;
    renderLaps();
    updateMergeBtn();
  }

  // 启动倒计时（两种模式共用），成功返回 true
  function startCountdown() {
    previewFromInputs();
    if (totalMs <= 0) { alert(t('alertTime')); return false; }
    startEpoch = Date.now();
    lapStartRemaining = totalMs;
    running = true;
    paused = false;
    finished = false;
    minInput.disabled = secInput.disabled = segInput.disabled = true;
    updateMainBtn();
    if (!preset) mainBtn.classList.add('running');
    pauseBtn.disabled = stopBtn.disabled = false;
    timerId = setInterval(tick, 100);
    syncScreenWakeLock();
    updateMergeBtn();
    render();
    return true;
  }

  mainBtn.addEventListener('click', () => {
    if (preset) return; // 预设模式用点击时间段操作
    if (!running) {
      // 开始倒计时（已有的时间段记录保留，序号继续累加）
      startCountdown();
    } else {
      // 记录一个时间段（舍入到整秒，保证 开始−结束=时长）
      const r = Math.max(0, Math.round(remaining() / 1000) * 1000);
      addLap(lapStartRemaining, r);
      lapStartRemaining = r;
    }
  });

  // 预设模式：点击时间段 = 开始倒计时 / 切换到该段计时
  function handleSegmentClick(idx) {
    if (finished || paused) return;
    let r;
    if (!running) {
      if (!startCountdown()) return;
      r = totalMs;
    } else {
      r = Math.max(0, Math.round(remaining() / 1000) * 1000);
      commitTiming(activeIdx, lapStartRemaining, r);
    }
    activeIdx = idx;
    lapStartRemaining = r;
    const lap = laps[idx];
    if (hasRecord(lap)) {
      // 立即显示本次计时为进行中的 child：
      // 若还没有 children，先把原记录变成第一个 child
      if (!lap.children.length) lap.children.push({ start: lap.start, end: lap.end });
      lap.children.push({ start: r, end: null });
      lap.start = lap.children[0].start;
    }
    renderLaps();
  }

  pauseBtn.addEventListener('click', () => {
    if (!running) return;
    if (!paused) {
      // 暂停：冻结剩余时间
      paused = true;
      pausedAt = Date.now();
      clearInterval(timerId);
      timerId = null;
      pauseBtn.textContent = t('resume');
      pauseBtn.classList.add('paused');
      syncScreenWakeLock();
      updateMainBtn(); // 暂停期间不能记录时间段
      updateMergeBtn();
      render();
    } else {
      // 继续：把暂停时长补偿到起点
      startEpoch += Date.now() - pausedAt;
      paused = false;
      pauseBtn.textContent = t('pause');
      pauseBtn.classList.remove('paused');
      syncScreenWakeLock();
      updateMainBtn();
      timerId = setInterval(tick, 100);
      updateMergeBtn();
      render();
    }
  });

  stopBtn.addEventListener('click', () => {
    if (!running) return;
    // 停止：结算当前一段并停止倒计时，已有记录保留
    stopCountdown(false);
  });

  mergeBtn.addEventListener('click', () => {
    mergePanel.hidden = false;
    mergeError.textContent = '';
    lapTable.classList.add('merge-open');
    updateRowHighlights();
    mergeInput.focus();
  });

  // 点击顶层时间段行：合并面板打开时 = 加入/移出输入框；预设模式 = 开始/切换计时
  lapBody.addEventListener('click', e => {
    const tr = e.target.closest('tr');
    if (!tr || !tr.dataset.n) return;
    const n = +tr.dataset.n;
    if (!mergePanel.hidden) {
      if (!hasRecord(laps[n - 1])) return; // 空段不能参与合并
      let nums = parseNums(mergeInput.value);
      if (nums.includes(n)) nums = nums.filter(x => x !== n);
      else nums.push(n);
      mergeInput.value = nums.sort((a, b) => a - b).join(' ');
      mergeError.textContent = '';
      updateRowHighlights();
      return;
    }
    if (preset) handleSegmentClick(n - 1);
  });

  // 手动输入时同步高亮
  mergeInput.addEventListener('input', updateRowHighlights);

  mergeCancel.addEventListener('click', hideMergePanel);

  function doMerge() {
    const nums = parseNums(mergeInput.value);
    if (nums.length < 2) {
      mergeError.textContent = t('errAtLeast2');
      return;
    }
    const bad = nums.filter(n => n < 1 || n > laps.length);
    if (bad.length) {
      mergeError.textContent = t('errInvalid')(bad.join(', '), laps.length);
      return;
    }
    const empty = nums.filter(n => !hasRecord(laps[n - 1]));
    if (empty.length) {
      mergeError.textContent = t('errEmpty')(empty.join(', '));
      return;
    }
    // 被选中的段按序号升序全部成为 children（已是 parent 的先展开其 children）
    const children = [];
    for (const n of nums) {
      const lap = laps[n - 1];
      if (lap.children.length) children.push(...lap.children);
      else children.push({ start: lap.start, end: lap.end });
    }
    // parent 是新的汇总行：开始=第一个 child 的开始，结束=最后一个 child 的结束
    const parent = {
      start: children[0].start,
      end: children[children.length - 1].end,
      children
    };
    laps[nums[0] - 1] = parent;
    // 从列表移除其余被合并的时间段（倒序删除），剩余时间段自动获得新序号
    for (let k = nums.length - 1; k >= 1; k--) laps.splice(nums[k] - 1, 1);
    hideMergePanel();
    renderLaps();
    updateMergeBtn();
  }

  mergeOk.addEventListener('click', doMerge);
  mergeInput.addEventListener('keydown', e => { if (e.key === 'Enter') doMerge(); });

  resetBtn.addEventListener('click', () => {
    clearInterval(timerId);
    timerId = null;
    running = false;
    paused = false;
    syncScreenWakeLock();
    minInput.disabled = secInput.disabled = segInput.disabled = false;
    mainBtn.classList.remove('running');
    pauseBtn.textContent = t('pause');
    pauseBtn.classList.remove('paused');
    pauseBtn.disabled = stopBtn.disabled = true;
    rebuild(); // 按段数输入重建（0=顺序模式清空；N=预设 N 个空段）
    previewFromInputs();
  });

  minInput.addEventListener('input', () => { if (!running && !finished) previewFromInputs(); });
  secInput.addEventListener('input', () => { if (!running && !finished) previewFromInputs(); });
  segInput.addEventListener('input', () => { if (!running) { rebuild(); previewFromInputs(); } });
  document.addEventListener('visibilitychange', syncScreenWakeLock);
  document.addEventListener('fullscreenchange', () => {
    fullscreenBtn.textContent = document.fullscreenElement ? t('exitFullscreen') : t('fullscreen');
    fullscreenBtn.setAttribute('aria-pressed', String(!!document.fullscreenElement));
    syncScreenWakeLock();
  });

  fullscreenBtn.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else {
        await document.documentElement.requestFullscreen();
      }
    } catch (error) {
      console.warn('Unable to change fullscreen mode.', error);
      alert(t('fullscreenError'));
    }
  });

  // 空格键 = 点击「开始 / 记录时间段」（在合并序号文本框中打字时除外）
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space' || e.repeat) return;
    const t = e.target;
    if (t === mergeInput || t.tagName === 'TEXTAREA') return;
    e.preventDefault(); // 阻止页面滚动和聚焦按钮的默认空格触发
    if (!mainBtn.disabled) mainBtn.click();
  });

  document.getElementById('langBtn').addEventListener('click', () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    applyLang();
  });

  rebuild();
  previewFromInputs();
  applyLang();
})();
</script>
</body>
</html>
